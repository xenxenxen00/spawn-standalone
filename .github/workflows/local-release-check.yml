name: Local release check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-node24:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      VITEST_MAX_WORKERS: 1
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium for local browser checks
        run: npx --no-install playwright install chromium
      - name: Verify dependency notice inventory
        run: node tools/release/notices.ts --check
      - name: Audit public source and Git history
        run: npm run audit:source
      - name: Build public package entries
        run: npm run build:packages
      - name: Type check, source rules and unit tests
        run: npm run check
      - name: Pack, audit and test an external offline installation
        run: npm run release:check -- --out "${{ runner.temp }}/spawn-standalone-release"
